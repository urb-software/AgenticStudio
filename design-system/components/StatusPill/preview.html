<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatusPill — preview</title></head>
<body>
<div id="root" class="as-root"></div>
<script>
  var A = window.AgentStudio, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'as-row'},['queued','running','awaiting','succeeded','failed','cancelled','none'].map(function(s){return h(A.StatusPill,{key:s,status:s})})));
</script>
</body>
</html>
