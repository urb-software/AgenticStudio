<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Studio</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:320px; width:960px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:320px; overflow:hidden; }
  .art svg { display:block; width:480px; height:320px; }
  .brand { fill:var(--accent-solid); }
  .tint { fill:var(--accent-tint); }
  .ink { fill:var(--text); }
  .run { fill:var(--run-running); }
  .gate { fill:var(--run-awaiting); }
  .dot { fill:var(--accent); }
  .blk { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:112px; line-height:.92; font-weight:600; letter-spacing:-.035em; color:var(--text); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--text-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 320" width="480" height="320">
<!--
  blocks      accent-solid 176×312 slab bled off the top (the one brand colour, largest) · accent-tint 128×168 · text (ink) 144×168 bleeding off the right · run-running 96×64 · run-awaiting 48×16 pill, small because amber only ever means "waiting on you"
  arrangement one tall violet slab with satellites, bottoms on one line space-6 above the edge, space-4 gutters, read left to right like the run timeline
  pattern     dot grid, from "precise, technical, mono, a 4px grid" and the dotted workflow canvas: 10×6 accent dots at a space-3 pitch on the ground above the tint
  scales      sides in space-2 multiples; gutters space-4; pitch space-3; corners radius-lg; pill rx half its height (radius-full)
-->
