# Studio's user-level Codex configuration for the agent user (Issues #106, #134). GUARDRAILS, NOT
# THE SECURITY BOUNDARY: the boundary is the operating-system user with its rootless Docker daemon
# (ADR 0002, docs/engineering/security.md §2).
#
# Before every Codex Run step the agent worker writes the whole of $HOME/.codex/config.toml from
# this file, overwriting any edits, and appends one `[projects."<path>"] trust_level =
# "untrusted"` entry for every existing Working copy (the command-line override is ignored by the
# CLI: compliance record, technical finding 3). An untrusted project loads none of its `.codex/`
# configuration, hooks or rules; in 0.169.0 the CLI skips its AGENTS.md too, so the worker puts
# that text into the prompt itself.
#
# Since #134 Studio's settings are managed: the sandbox network, the command environment and the
# feature flags are in /etc/codex/managed_config.toml (codex-managed-config.toml), the hook and
# the enforced command rules in /etc/codex/requirements.toml (codex-requirements.toml), both
# root-owned and checked by the worker before every step. Only the per-Working-copy trust entries
# stay here. Do not add a [projects] or [hooks] table here; the worker refuses a template that has
# one.
