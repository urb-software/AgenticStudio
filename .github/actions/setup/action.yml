# Shared pnpm + Node.js setup for the CI code jobs (Issue #28). The calling job checks out the
# repository first (a local action is read from the workspace). Pins and caching are unchanged
# from the per-job steps this replaces; scripts/ci/ci-policy.test.mjs checks the pins and usage.
name: Setup pnpm and Node.js
description: pnpm (version from packageManager), Node.js with optional pnpm cache, optional frozen install.

inputs:
  node-version:
    description: Node.js version for actions/setup-node.
    required: true
  cache:
    description: actions/setup-node `cache` value ('pnpm', or '' for no cache).
    required: false
    default: pnpm
  install:
    description: Run `pnpm install --frozen-lockfile` ('true' or 'false').
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
