# PR CI for `dev` (Issue #15; job names from docs/engineering/quality.md §7).
#
# - Always triggers (no trigger-level path filter). The `changes` job classifies the PR with the
#   repo-owned, unit-tested scripts/ci/ci-policy.mjs (Epic #8 decision 6); code jobs are skipped
#   only for docs-only PRs. Pushes to `dev` always run every job.
# - `ci:required` always runs and is the single check the `protect-dev` ruleset requires.
# - Security: no `pull_request_target`, no secrets, read-only token, actions pinned by commit SHA.
# - Code jobs share pnpm/Node.js setup via the local composite action .github/actions/setup (#28),
#   used after actions/checkout; `changes` and `ci:required` need Node.js only.
name: CI

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24.22.1

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its first parent (the base it was merged onto).
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Unit-test the CI policy
        run: node --test "scripts/ci/*.test.mjs"
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push to $GITHUB_REF: every job runs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both sides of a rename, so moving code into docs/ is not docs-only.
          git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed-files.txt"
          node scripts/ci/ci-policy.mjs classify < "$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"

  quality-api:
    name: quality:api
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm check:api

  quality-web:
    name: quality:web
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm check:web
      # Whole-repository Prettier check (scripts/, tests/ and root files are outside check:api/web).
      - run: pnpm format:check
      # Design-system viewer server (design-system/serve.mjs, Issue #53): node:test, no dependencies.
      # Runs here so it needs no new required check; any design-system/** change is a code change.
      - run: pnpm design:test

  architecture-api:
    name: architecture:api
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm architecture:api

  architecture-web:
    name: architecture:web
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm architecture:web

  architecture-monorepo:
    name: architecture:monorepo
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm architecture:monorepo

  test-api:
    name: test:api
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Testcontainers starts throwaway PostgreSQL and Redis on the runner's Docker. Tests that log in
      # hash their own throwaway password; no secrets are used.
      - run: pnpm test:api

  test-web:
    name: test:web
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm test:web

  test-contracts:
    name: test:contracts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Regenerates OpenAPI and the web client and fails on drift. Required: the architecture gates'
      # generated-client cycle exemption relies on it.
      - run: pnpm contracts:check

  e2e-smoke:
    name: e2e:smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Chromium for the pinned @playwright/test, with its system libraries.
      - run: pnpm exec playwright install --with-deps chromium
      # Builds the packages, API and web, starts them against throwaway PostgreSQL and Redis
      # (Testcontainers on the runner's Docker) with a random per-run operator password, then
      # runs Playwright: login -> create -> list -> reload. No secrets are used.
      - run: pnpm e2e:smoke

  security:
    name: security
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No pnpm cache and no install: `pnpm audit` reads pnpm-lock.yaml only.
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ''
          install: 'false'
      # All dependencies (prod and dev) from pnpm-lock.yaml. Exceptions only via
      # auditConfig.ignoreGhsas, each with a reason and a review date (Epic #8 decision 5).
      - run: pnpm audit --audit-level high

  ci-required:
    name: ci:required
    if: always()
    needs:
      - changes
      - quality-api
      - quality-web
      - architecture-api
      - architecture-web
      - architecture-monorepo
      - test-api
      - test-web
      - test-contracts
      - e2e-smoke
      - security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Fails unless `changes` succeeded and every code job succeeded (code change) or was skipped
      # (docs-only change). A failed, cancelled or wrongly skipped job makes this check red.
      - name: Evaluate required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/ci-policy.mjs required
