packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': false
  cpu-features: false
  prisma: true
  protobufjs: false
  ssh2: false

engineStrict: true

# Temporary, scoped to nestjs-zod only: nestjs-zod@5.6.0 still declares NestJS 10/11 peers,
# but #12's validation, OpenAPI and determinism tests prove it works on NestJS 12.
# Decision: https://github.com/urb-software/AgenticStudio/issues/12#issuecomment-6830882279
# Review by 2027-02-12; remove once upstream supports NestJS 12.
# Tracking task #19: https://github.com/urb-software/AgenticStudio/issues/19
peerDependencyRules:
  allowedVersions:
    'nestjs-zod>@nestjs/common': '12.4.2'
    'nestjs-zod>@nestjs/swagger': '12.1.1'

# Temporary security override, scoped to the hey-api chain only: @hey-api/json-schema-ref-parser@1.4.4
# (pulled in by apps/web > @hey-api/openapi-ts) pins js-yaml 4.2.0, which has three high advisories:
# GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh. 4.3.2 is the patched release of the
# same major; contracts:generate stays deterministic with it. Decision: #15 (coordinator, option a).
# Review by 2027-02-12; remove once upstream depends on a patched js-yaml.
# Tracking task #19: https://github.com/urb-software/AgenticStudio/issues/19
overrides:
  '@hey-api/json-schema-ref-parser>js-yaml': '4.3.2'
