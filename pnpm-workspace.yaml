packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': false
  cpu-features: false
  msgpackr-extract: false
  prisma: true
  protobufjs: false
  ssh2: false

engineStrict: true

# Supply-chain policy (Issue #30 decision 4): pnpm resolves and installs only versions published
# at least 7 days ago (10080 minutes), so a compromised release has time to be found and pulled.
# Exclusions are exact versions only, each justified; process: docs/engineering/security.md §3
# "Dependency supply chain". Urgent security fixes go in `minimumReleaseAgeExclude` with their
# own comment (advisory, Issue, removal date).
minimumReleaseAge: 10080

# Temporary, scoped to nestjs-zod only: nestjs-zod@5.6.0 still declares NestJS 10/11 peers,
# but #12's validation, OpenAPI and determinism tests prove it works on NestJS 12.
# Decision: https://github.com/urb-software/AgenticStudio/issues/12#issuecomment-6830882279
# Review by 2027-02-12; remove once upstream supports NestJS 12.
# Tracking task #19: https://github.com/urb-software/AgenticStudio/issues/19
peerDependencyRules:
  allowedVersions:
    'nestjs-zod>@nestjs/common': '12.4.2'
    'nestjs-zod>@nestjs/swagger': '12.1.1'

# Temporary security override, scoped to the hey-api chain only: @hey-api/json-schema-ref-parser@1.4.4
# (pulled in by apps/web > @hey-api/openapi-ts) pins js-yaml 4.2.0, which has three high advisories:
# GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh. 4.3.2 is the patched release of the
# same major; contracts:generate stays deterministic with it. Decision: #15 (coordinator, option a).
# Review by 2027-02-12; remove once upstream depends on a patched js-yaml.
# Tracking task #19: https://github.com/urb-software/AgenticStudio/issues/19
overrides:
  '@hey-api/json-schema-ref-parser>js-yaml': '4.3.2'
  # Temporary security override, scoped to the Prisma chain only: @prisma/config@7.10.1 (pulled in
  # by packages/database > prisma) pins effect 3.20.0, affected by GHSA-7589-6fvf-x4pw (ReDoS in
  # Schema.TemplateLiteral; high). 3.22.4 is a patched release of the same major, out for more than
  # two weeks. Decision: #246 (coordinator). Review by 2027-02-20; remove once Prisma depends on a
  # patched effect. Tracking: https://github.com/urb-software/AgenticStudio/issues/246
  '@prisma/config>effect': '3.22.4'

# Temporary audit ignore, scoped to one advisory: GHSA-fc5q-39xc-vjpf (picomatch <=4.0.7, ReDoS
# through single-branch repeated extglobs; high). The patched 4.0.8 is not yet released. It is
# reported on about 100 paths, all in the dev-only toolchain: dependency-cruiser, typescript-eslint,
# vite/vitest, Nest CLI and eslint-config-next (including picomatch 2.3.2 via eslint-config-next).
# No production dependency path reaches picomatch, and its glob patterns come only from committed
# configuration, so no untrusted input.
# Decision: operator, 2026-11-17. Review by 2027-02-17; remove once `pnpm audit` no longer reports
# GHSA-fc5q-39xc-vjpf without this ignore (every path on a patched picomatch).
# Tracking Issue #191: https://github.com/urb-software/AgenticStudio/issues/191
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
